<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Logo d’origine — UnityQuest</title><style>

lute;top:0;left:0;z-index:-1;transform:translateZ(-10px) translateY(2px);opacity:.7;color:#fc7}.depth.second{z-index:-2;transform:translateZ(-20px) translateY(4px);opacity:.5;color:#fa5}h2{font-family:'Trebuchet MS',sans-serif;font-size:20px;line-height:28px;font-weight:500;color:#6b7280;letter-spacing:.5em;text-shadow:-1px -1px 1px #ffffffe6,1px 1px 2px #0008,2px 2px 3px #0005;transform:perspective(400px) rotateX(10deg) scaleY(.95);display:inline-block;margin:-8px 0 0;white-space:pre-line}.tag{margin:30px 0 0;font-size:12px;line-height:18px;color:#4b5563}
